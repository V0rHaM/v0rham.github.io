<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плагины V0rHaM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: rgba(20, 25, 35, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #7b5cff;
            --accent-hover: #9d85ff;
            --text: #e6e9f0;
            --text-muted: #8a93a6;
            --gradient: linear-gradient(135deg, #7b5cff 0%, #00c6ff 100%);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            background-image: radial-gradient(circle at 20% 10%, rgba(123, 92, 255, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 80% 90%, rgba(0, 198, 255, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        header {
            text-align: center;
            margin-bottom: 48px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto 28px;
        }

        .search-box {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 999px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.07);
        }

        .search-box svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            backdrop-filter: blur(12px);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(123, 92, 255, 0.4);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(123, 92, 255, 0.2);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .card .desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            flex: 1;
            margin-bottom: 20px;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .tag {
            background: rgba(123, 92, 255, 0.15);
            color: var(--accent-hover);
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.02em;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            border-radius: 999px;
            background: var(--gradient);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
            border: none;
            cursor: pointer;
        }

        .btn:hover { opacity: 0.9; transform: scale(1.01); }
        .btn:active { transform: scale(0.99); }

        .btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state strong { color: var(--text); }

        @media (max-width: 640px) {
            .container { padding: 24px 16px 60px; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Плагины V0rHaM</h1>
        <p class="subtitle">Коллекция проверенных плагинов для Minecraft-серверов. Прямые ссылки на последние версии.</p>
        <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
            <input type="text" id="searchInput" placeholder="Поиск по названию…" autocomplete="off">
        </div>
    </header>

    <main class="grid" id="pluginGrid"></main>
</div>

<script>
    const plugins = [
        {
            name: "AuthVH",
            desc: "Простой плагин авторизации: регистрация, вход, управление сессиями и账户.",
            version: "1.9.141",
            tag: "Авторизация",
            url: "https://github.com/V0rHaM/AuthVH-plugin/releases/latest"
        },
        {
            name: "RandomTP",
            desc: "Случайная телепортация игроков с настройкой кулдауна, радиусов и безопасных мест.",
            version: "2.0-SNAPSHOT",
            tag: "Телепортация",
            url: "https://modrinth.com/plugin/randomtp"
        },
        {
            name: "HiddenNamesVH",
            desc: "Скрывает ники игроков над головой. Лёгкий и ненавязчивый.",
            version: "1.0",
            tag: "Чат",
            url: "https://www.spigotmc.org/resources/hiddennamesvh.111974/"
        },
        {
            name: "HitPointMobsVH",
            desc: "Изменяйте здоровье любого моба через конфигурационный файл.",
            version: "1.0",
            tag: "Мобы",
            url: "https://www.spigotmc.org/resources/hitpointmobsvh.111974/"
        },
        {
            name: "SpyCommand",
            desc: "Мониторинг команд игроков в реальном времени для администрации.",
            version: "1.0",
            tag: "Модерация",
            url: "https://www.spigotmc.org/resources/spycommand.112089/"
        },
        {
            name: "HomeVH",
            desc: "Установка и телепортация на домашние точки с гибкими настройками.",
            version: "1.0.0",
            tag: "Телепортация",
            url: "https://github.com/V0rHaM/HomeVH/releases/latest"
        },
        {
            name: "StaffMenuVH",
            desc: "Удобное меню для стаффа с быстрым доступом к инструментам модерации.",
            version: "1.2.0",
            tag: "Модерация",
            url: "https://github.com/V0rHaM/StaffMenuVH/releases/latest"
        },
        {
            name: "Needful",
            desc: "Набор полезных утилит для повседневного администрирования сервера.",
            version: "1.1.0",
            tag: "Утилиты",
            url: "https://github.com/V0rHaM/Needful/releases/latest"
        },
        {
            name: "InfiniteClans",
            desc: "Система кланов с бесконечным развитием, войнами и управлением.",
            version: "1.5.2",
            tag: "Кланы",
            url: "https://github.com/V0rHaM/InfiniteClans/releases/latest"
        },
        {
            name: "ChatVH",
            desc: "Улучшение чата: форматирование, фильтры, каналы и префиксы.",
            version: "1.0.3",
            tag: "Чат",
            url: "https://github.com/V0rHaM/ChatVH/releases/latest"
        },
        {
            name: "MultiGUI",
            desc: "Создание многостраничных GUI-меню через конфиг без программирования.",
            version: "1.0.0",
            tag: "GUI",
            url: "https://github.com/V0rHaM/MultiGUI/releases/latest"
        },
        {
            name: "SkinPatchVH",
            desc: "Патч для корректного отображения скинов на сервере.",
            version: "1.0.0",
            tag: "Скины",
            url: "https://github.com/V0rHaM/SkinPatchVH/releases/latest"
        }
    ];

    const grid = document.getElementById('pluginGrid');
    const searchInput = document.getElementById('searchInput');

    function iconLetter(name) {
        return name.replace(/[^A-Za-z]/g, '').charAt(0).toUpperCase() || 'P';
    }

    function render(list) {
        if (list.length === 0) {
            grid.innerHTML = `<div class="empty-state"><strong>Ничего не найдено.</strong><br>Попробуйте другое название.</div>`;
            return;
        }
        grid.innerHTML = list.map(p => `
            <article class="card">
                <div class="card-icon">${iconLetter(p.name)}</div>
                <h2>${p.name}</h2>
                <p class="desc">${p.desc}</p>
                <div class="card-meta">
                    <span class="tag">${p.tag}</span>
                    <span>v${p.version}</span>
                </div>
                <a class="btn" href="${p.url}" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Скачать последнюю версию
                </a>
            </article>
        `).join('');
    }

    searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim().toLowerCase();
        const filtered = plugins.filter(p =>
            p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.tag.toLowerCase().includes(q)
        );
        render(filtered);
    });

    render(plugins);
</script>
</body>
</html>
