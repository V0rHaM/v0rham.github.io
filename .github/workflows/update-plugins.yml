# .github/workflows/update-plugins.yml
name: Update Plugin Data

on:
  schedule:
    # Запускать каждый час (в начале часа)
    - cron: '0 * * * *'
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install spigot-sdk

      - name: Fetch latest plugin data
        run: node scripts/fetch-plugins.js

      - name: Commit and push if data changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/plugins.json
          # Проверяем, есть ли изменения, и коммитим только если они есть
          git diff --staged --quiet || git commit -m "chore: update plugin data"
          git push
