# .github/workflows/update-plugins.yml
name: Update Plugin Data

on:
  schedule:
    - cron: '0 * * * *' # Каждый час
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'  <-- Мы это удалили

      - name: Install dependencies
        run: npm install   # <-- Заменили ci на install

      - name: Fetch latest plugin data
        run: npm run fetch-plugins

      - name: Commit and push if data changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/plugins.json
          git diff --staged --quiet || git commit -m "chore: update plugin data"
          git push
